name: Docker Build and Push

on:
    push:
        branches:
            - '**'

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Check Out Repo
              uses: actions/checkout@v2

            - name: Log in to Docker Hub
              uses: docker/login-action@v1
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v1

            - name: Generate tag
              id: prep
              run: |
                  if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
                    echo "::set-output name=tag::latest"
                  else
                    echo "::set-output name=tag::$(date +'%Y%m%d%H%M%S')-$(git rev-parse --short HEAD)"
                  fi

            - name: Build and Push Docker image
              uses: docker/build-push-action@v2
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: haozhealexzhang/cognitube-audio-conversion-job:${{ steps.prep.outputs.tag }}

            - name: List Docker images after build
              run: docker images

            - name: Clean up Post Run
              run: |
                  docker rmi haozhealexzhang/cognitube-audio-conversion-job:${{ steps.prep.outputs.tag }} || true
                  if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
                    docker rmi haozhealexzhang/cognitube-audio-conversion-job:latest || true
                  fi
